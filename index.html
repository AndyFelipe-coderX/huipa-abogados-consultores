    <!-- Aplica el tema (día/noche) antes de pintar para evitar parpadeo -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131210');
          }
        } catch (e) {}
      })();
    </script>
  </head>
